services:
  cctvbkk:
    build: .
    container_name: cctvbkk
    ports:
      - "${PORT:-5455}:5455"
    environment:
      # lets the nginx template use the host's DNS servers for the DOH relay
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - status:/srv/status:ro
    restart: unless-stopped
    # ใช้ bridge network เดิมของ Docker เพราะเครื่องนี้สร้าง network ใหม่ไม่ได้ (address pool เต็ม)
    network_mode: bridge

  # ตรวจกล้องทุกตัวทุก 30 นาที แล้วเขียน status.json ให้หน้าเว็บซ่อนกล้องที่เสีย
  checker:
    image: python:3.12-alpine
    container_name: cctvbkk-checker
    working_dir: /app
    command: sh -c 'while true; do python scripts/check_cameras.py || true; sleep 1800; done'
    environment:
      CCTV_DATA: /app/cctv/data
      CCTV_STATUS: /srv/status/status.json
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./cctv/data:/app/cctv/data:ro
      - status:/srv/status
    restart: unless-stopped
    network_mode: bridge

volumes:
  status:
